name: Deploy Cloudflare backend
on:
  workflow_dispatch:
    inputs:
      provider:
        description: Feed to deploy (AISStream requires documented public-use permission)
        type: choice
        options: [digitraffic, aisstream]
        default: digitraffic
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: cloudflare-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.repository == 'nikokoren/port_of_call' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: astral-sh/setup-uv@v7
      - run: python -m pip install -r requirements.txt && python -m pip install --no-deps -e .
      - run: python -m unittest discover -s tests -q
      - run: npm ci && npm test
      - run: npm ci && uv sync --frozen
        working-directory: cloudflare
      - run: python scripts/prepare_cloudflare.py
      - name: Deploy and verify real feed
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API }}
          DEPLOY_PROVIDER: ${{ inputs.provider }}
        run: python scripts/deploy_cloudflare.py --provider "$DEPLOY_PROVIDER"
      - name: Record verified public origin for monitoring and downloads
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add deploy/release.json
          if ! git diff --cached --quiet; then
            git commit -m "Record verified Cloudflare private-beta origin"
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cloudflare-private-beta
          path: |
            dist/*.zip
            var/deployment-result.json
            var/release-check.json
          retention-days: 30
  site:
    needs: deploy
    uses: ./.github/workflows/publish-site.yml
