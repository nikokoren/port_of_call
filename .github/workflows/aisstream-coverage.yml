name: AISStream coverage
on:
  workflow_dispatch:
    inputs:
      seconds:
        description: Observation window in seconds (60–900)
        required: true
        default: '900'
      ports:
        description: Comma-separated candidate IDs; leave blank for all 15
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  group: aisstream-private-coverage
  cancel-in-progress: false
jobs:
  probe:
    if: github.repository == 'nikokoren/port_of_call' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt && python -m pip install --no-deps -e .
      - name: Observe one shared AISStream subscription
        env:
          # The repository secret stays on the runner; never extract or print it.
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API }}
          PROBE_SECONDS: ${{ inputs.seconds }}
          PROBE_PORTS: ${{ inputs.ports }}
        run: |
          python -c 'import os; n=int(os.environ["PROBE_SECONDS"]); assert 60 <= n <= 900, "Window must be 60–900 seconds"'
          if [ -n "$PROBE_PORTS" ]; then
            python -m port_of_call.coverage --seconds "$PROBE_SECONDS" --ports "$PROBE_PORTS" --output var/coverage.json
          else
            python -m port_of_call.coverage --seconds "$PROBE_SECONDS" --output var/coverage.json
          fi
      - name: Retain counts only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aisstream-coverage-${{ github.run_id }}
          path: var/coverage.json
          if-no-files-found: warn
          retention-days: 7
      - name: Coverage summary
        if: always()
        run: |
          python - <<'PY'
          import json,os,pathlib
          path=pathlib.Path('var/coverage.json')
          if path.exists():
              r=json.loads(path.read_text())
              with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
                  f.write('Private evaluation: '+r['outcome']+'\n\n')
                  f.write('No public-display rights or catalog entries are automatically approved.\n\n')
                  f.write('| Area | Distinct observed | Fresh <30m | Named | Oriented |\n|---|---:|---:|---:|---:|\n')
                  for h in r['harbors']:
                      vals=[h['distinct_observed'],h['fresh_under_30min'],h['names'],h['usable_orientation']]
                      f.write('| '+h['name']+' | '+' | '.join('unmeasured' if v is None else str(v) for v in vals)+' |\n')
          PY
