name: Checks
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      live:
        description: Include real Finnish feed and native restart validation
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: python -m pip install -r requirements.txt && python -m pip install --no-deps -e .
      - run: python -m unittest discover -s tests -v
      - run: npm ci && npm test && npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: private-plugin
          path: dist/port-of-call.zip
  cloudflare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: astral-sh/setup-uv@v7
      - run: npm ci
        working-directory: cloudflare
      - run: python scripts/prepare_cloudflare.py
      - run: uv sync --frozen && uv run pywrangler deploy --dry-run --outdir build
        working-directory: cloudflare
      - name: Native Workers runtime smoke test
        run: |
          if [ "$LIVE_CHECK" = true ]; then
            python scripts/cloudflare_smoke.py --live
          else
            python scripts/cloudflare_smoke.py
          fi
        env:
          LIVE_CHECK: ${{ inputs.live || false }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cloudflare-runtime-check
          path: |
            var/cloudflare-runtime.log
            var/cloudflare-smoke.json
            var/cloudflare-live.json
          retention-days: 7
