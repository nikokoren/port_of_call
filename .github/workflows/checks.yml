name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: python -m pip install -r requirements.txt && python -m pip install --no-deps -e .
      - run: python -m unittest discover -s tests -v
      - run: npm ci && npm test && npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: private-plugin
          path: dist/port-of-call.zip
  cloudflare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: astral-sh/setup-uv@v7
      - run: npm ci
        working-directory: cloudflare
      - run: python scripts/prepare_cloudflare.py
      - run: uv sync --frozen && uv run pywrangler deploy --dry-run --outdir build
        working-directory: cloudflare
      - name: Native Workers runtime smoke test
        run: |
          set -e
          mkdir -p var
          (cd cloudflare && uv run pywrangler dev --port 8790 --ip 127.0.0.1 > ../var/cloudflare-runtime.log 2>&1) &
          worker_pid=$!
          trap 'kill "$worker_pid" 2>/dev/null || true' EXIT
          python - <<'PY'
          import time,urllib.request
          for attempt in range(90):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:8790/',timeout=5) as r:
                      if r.status==200: break
              except Exception: time.sleep(2)
          else: raise SystemExit('Workers runtime did not start; inspect runtime artifact')
          PY
          python scripts/check_service.py http://127.0.0.1:8790 --allow-local --allow-degraded --all-framings --output var/cloudflare-smoke.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cloudflare-runtime-check
          path: |
            var/cloudflare-runtime.log
            var/cloudflare-smoke.json
          retention-days: 7
