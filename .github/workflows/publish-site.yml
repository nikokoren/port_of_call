name: Publish setup and downloads
on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [main]
    paths:
      - 'deploy/release.json'
      - 'scripts/build_release_site.py'
      - 'settings.yml'
      - '*.liquid'
      - 'docs/**'
      - '.github/workflows/publish-site.yml'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'nikokoren/port_of_call' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/configure-pages@v5
      - run: python scripts/build_release_site.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
