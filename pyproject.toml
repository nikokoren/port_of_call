[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "port-of-call"
version = "0.1.0"
description = "Shared, truthful harbor AIS snapshots for TRMNL"
requires-python = ">=3.12"
dependencies = ["aiohttp==3.14.4"]

[project.scripts]
port-of-call = "port_of_call.app:main"

[tool.setuptools.package-data]
port_of_call = ["harbors.json"]

[tool.setuptools.packages.find]
include = ["port_of_call*"]
